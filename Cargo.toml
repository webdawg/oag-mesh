[workspace]
resolver = "2"
members = [
    "crates/oag-mesh",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
# Foundational types/signing from the base project (github.com/webdawg/open-agent-graph) --
# reused via git dependency rather than vendored, so this repo never drifts from that one's
# canonical JSON / domain-separated-signing conventions. Pinned to `main`; move to a tagged rev
# once open-agent-graph starts cutting releases.
oag-core = { git = "https://github.com/webdawg/open-agent-graph.git", branch = "main" }
oag-crypto = { git = "https://github.com/webdawg/open-agent-graph.git", branch = "main" }
# Read-only access to the layer below: the node's own identity (`identity.key`) and its peer list
# (the `peers`/`peer_addresses` tables). Same posture as `oag-imagination`'s `NodeAdapter`, which
# depends on this crate the same way. Nothing here writes to the base project's storage.
oag-storage = { git = "https://github.com/webdawg/open-agent-graph.git", branch = "main" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
hex = "0.4"
blake3 = "1"
axum = "0.8"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
# Onion routing for anonymous-event submission (`spec/15-onion-routing.md`). X25519 for the
# per-hop key exchange (derived from each relay's Ed25519 identity), ChaCha20-Poly1305 for
# the layered encryption.
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
